
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">My To-Do List</a>
        </div>
    </nav>

    <!-- Main Section -->
    <div class="container mt-5">
        <div class="todo-box mx-auto">

            <h2 class="text-center mb-4">Manage Your Tasks</h2>

            <!-- Task Input -->
            <div class="input-group mb-2">
                <input type="text" id="taskInput"
                       class="form-control"
                       placeholder="Enter a new task">

                <button class="btn btn-primary" id="addBtn">
                    Add Task
                </button>
            </div>

            <p id="errorMessage" class="text-danger"></p>

            <!-- Task Counter -->
            <p id="taskCounter" class="text-muted">
                0 tasks remaining
            </p>

            <!-- Filter Buttons -->
            <div class="filter-buttons mb-3">
                <button class="btn btn-outline-primary filter-btn active"
                        data-filter="all">All</button>

                <button class="btn btn-outline-primary filter-btn"
                        data-filter="active">Active</button>

                <button class="btn btn-outline-primary filter-btn"
                        data-filter="completed">Completed</button>
            </div>

            <!-- Task List -->
            <ul id="taskList" class="list-group">
            </ul>

            <!-- Clear Completed -->
            <button class="btn btn-danger mt-3"
                    id="clearCompleted">
                Clear Completed
            </button>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
